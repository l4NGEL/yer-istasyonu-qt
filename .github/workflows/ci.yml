name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: Derleme + testler (Ubuntu 24.04, Qt 6.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtquick-dialogs \
            qml6-module-qtqml-workerscript libgtest-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Yapılandır
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGCS_WERROR=ON
      - name: Derle
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Çekirdek ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev
      - name: TSan için ASLR entropisini düşür
        if: matrix.sanitizer == 'thread'
        # Yeni çekirdeklerde mmap_rnd_bits=32 TSan'ın bellek düzenini bozar
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Yapılandır
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGCS_BUILD_APP=OFF
          -DGCS_SANITIZER=${{ matrix.sanitizer }}
      - name: Derle
        run: cmake --build build
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
